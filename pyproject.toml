[project]
name = "day16-agent-commerce"
version = "0.1.0"
description = "Advent of Agents Day 16: secure agent payments with UCP, AP2 and human approval"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk==2.11.0",
    "mcp==2.3.0",
    "ucp-sdk==0.5.0",
    # AP2 is not on PyPI (the PyPI "ap2" package is unrelated); pin the v0.2.0 release commit.
    "ap2 @ git+https://github.com/google-agentic-commerce/AP2.git@b4587ac1d055888a73b4b21750973cffba961793",
    "rfc8785==0.1.4",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
